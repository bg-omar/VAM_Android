<div class="app-container">
  <h1>Chat Archive Viewer</h1>
  <div class="upload">
    <label for="fileInput">Load JSON Archive:</label>
    <input id="fileInput" type="file" accept="application/json" (change)="onFileSelected($event)" />
  </div>

  <div *ngIf="conversations && conversations.length > 0" class="selector">
    <label for="conversationSelect">Select Conversation:</label>
    <select id="conversationSelect" [(ngModel)]="selectedIndex">
      <option *ngFor="let conv of conversations; let i = index" [ngValue]="i">
        {{ conv.title || ('Conversation ' + (i + 1)) }}
      </option>
    </select>
  </div>

  <!-- Render the treemap for the selected conversation -->
  <app-chat-archive *ngIf="selectedConversation" [conversation]="selectedConversation"></app-chat-archive>
</div>
